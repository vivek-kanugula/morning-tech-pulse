name: Daily Morning Tech Pulse Cloud Dispatcher

on:
  schedule:
    # 02:17 UTC = 07:47 AM IST | Offset from '00' to avoid peak GitHub cron queue
    - cron: '17 2 * * *'
  workflow_dispatch: # Manual 1-click trigger from GitHub Actions UI
  repository_dispatch:
    types: [trigger-morning-pulse] # External cron-job.org webhook trigger (bulletproof backup)

jobs:
  run-daily-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate n8n Workflow Schema
        run: |
          echo "Validating n8n JSON workflow schema..."
          python -m json.tool daily_tech_pulse_n8n.json > /dev/null
          echo "n8n workflow JSON is valid."

      - name: Run Morning Tech Pulse Dispatcher
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python main.py

      - name: Upload PDF Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-tech-pulse-${{ github.run_number }}
          path: Morning_Tech_Pulse.pdf
          if-no-files-found: ignore
          retention-days: 7
