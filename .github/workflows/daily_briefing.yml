name: Daily Morning Tech Pulse Cloud Dispatcher

on:
  schedule:
    # 02:00 UTC = 07:30 AM IST (India Standard Time)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual 1-click test in GitHub Actions UI

jobs:
  run-daily-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate n8n Workflow Schema
        run: |
          echo "🔍 Validating n8n JSON workflow schema..."
          python -m json.tool daily_tech_pulse_n8n.json > /dev/null
          echo "✅ n8n workflow JSON is syntactically valid."

      - name: Run Morning Tech Pulse Dispatcher
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          echo "🚀 Executing Morning Tech Pulse Pipeline..."
          python main.py
          echo "🎉 Executive 3-page PDF briefing dispatched successfully!"
